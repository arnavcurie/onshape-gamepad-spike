<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gamepad-in-iframe spike</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 1.1rem;
        font: 14px/1.5 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
        background: #11151a; color: #e6ecf2;
      }
      h1 { font-size: 1rem; margin: 0 0 .9rem; font-weight: 600; letter-spacing: .01em; }
      h1 span { color: #7c8794; font-weight: 400; }

      #verdict {
        padding: .9rem 1.1rem; border-radius: 8px; margin-bottom: 1rem;
        font-size: 1.05rem; font-weight: 600; border: 1px solid;
      }
      .pass { background: #10301f; border-color: #2f7f57; color: #7ee2a8; }
      .fail { background: #3a1a1a; border-color: #8d3a3a; color: #ff9a9a; }
      .wait { background: #33280f; border-color: #8a6a1e; color: #f0c674; }
      #verdict small { display: block; font-weight: 400; font-size: .8rem; margin-top: .35rem; opacity: .85; }

      table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
      td { padding: .38rem .55rem; border-bottom: 1px solid #232a33; vertical-align: top;
           font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      td.k { color: #808b99; width: 15rem; }
      .y { color: #7ee2a8; } .n { color: #ff9a9a; } .m { color: #f0c674; }

      .bar { display: inline-block; height: 7px; background: #4c8dff; border-radius: 4px; vertical-align: middle; }
      button {
        font: inherit; padding: .45rem .9rem; border-radius: 6px; cursor: pointer;
        background: #1b222b; color: #e6ecf2; border: 1px solid #333d49;
      }
      button:hover { border-color: #4c8dff; color: #9ccbff; }
      pre {
        background: #0c1014; border: 1px solid #232a33; border-radius: 6px;
        padding: .7rem .85rem; font-size: 11px; overflow-x: auto; white-space: pre-wrap;
        color: #b9c4d0; margin: .6rem 0 0;
      }
      .hint { color: #808b99; font-size: 11.5px; margin-top: .9rem; }

      /* An Onshape "Element right panel" is a narrow strip. Stack each check
         onto its own line rather than letting a fixed label column squeeze the
         value into unreadable wrapping — a mangled layout here would be easy to
         misread as a failed check. */
      @media (max-width: 560px) {
        body { padding: .7rem; }
        h1 { font-size: .9rem; }
        h1 span { display: none; }
        #verdict { font-size: .92rem; padding: .7rem .8rem; }
        table, tbody, tr, td { display: block; width: 100%; }
        tr { border-bottom: 1px solid #232a33; padding: .3rem 0; }
        td { border: 0; padding: 0; }
        td.k { width: auto; font-size: 10.5px; text-transform: uppercase;
               letter-spacing: .06em; color: #6d7783; }
        pre { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <h1>Gamepad-in-iframe spike <span>&mdash; can an Onshape app tab see a controller?</span></h1>

    <div id="verdict" class="wait">Checking&hellip;</div>

    <table id="checks"></table>

    <button id="copy">Copy diagnostic</button>
    <pre id="dump">&hellip;</pre>

    <p class="hint">
      The Permissions&nbsp;Policy answer does <b>not</b> need a controller connected — it is
      reported by the browser directly. The live readout below it is the second question:
      whether a focused iframe actually receives axis updates.
    </p>

    <script>
      // Two independent questions, and they can disagree:
      //
      //   1. Is the `gamepad` Permissions Policy feature delegated to this frame?
      //      The feature defaults to `self`, so a cross-origin iframe only gets it
      //      if the embedder sets allow="gamepad". document.featurePolicy answers
      //      this immediately, with no controller and no user gesture.
      //
      //   2. Even if allowed, does the frame receive live updates? Chrome only
      //      refreshes gamepad state for the FOCUSED document, and a frame has to
      //      hold focus itself — clicking the CAD viewport would take it away.
      //
      // Question 1 decides whether the integrated-app route is viable at all.
      // Question 2 decides whether it is actually nicer than the localhost bridge.

      const el = (id) => document.getElementById(id);
      const rows = [];
      let everSaw = false, maxAxis = 0, samples = 0, lastIds = [];

      // Question 3, and the one that decides whether being inside Onshape beats
      // the localhost bridge: does the frame still receive axis updates once the
      // user clicks the CAD viewport and this frame loses focus?
      //
      // It has to be recorded rather than observed, because reading the result
      // requires clicking back into the frame — which restores focus and destroys
      // the state being measured.
      let blurTicks = 0, blurPadTicks = 0, blurMaxAxis = 0, blurEverPad = false;

      const inIframe = (() => { try { return window.self !== window.top; } catch { return true; } })();

      //----------------------------------------------------------------------------------------------
      // policyState
      // Answers question 1 with no controller and no user gesture. Reports
      // `supported` separately from `allowed` because a non-Chromium browser
      // lacking the API is "unknown", which is not the same as "blocked" — and
      // showing them as the same thing would condemn a working setup.
      //----------------------------------------------------------------------------------------------
      function policyState() {
        const fp = document.featurePolicy || document.permissionsPolicy;
        if (!fp || typeof fp.allowsFeature !== "function") return { supported: false, allowed: null };
        let known = true;
        try { known = fp.features().includes("gamepad"); } catch { known = true; }
        return { supported: true, allowed: fp.allowsFeature("gamepad"), known };
      }

      //----------------------------------------------------------------------------------------------
      // row / render
      // Rows are rebuilt from scratch every tick, so the table always reflects
      // the current reading rather than accumulating stale entries.
      //----------------------------------------------------------------------------------------------
      function row(k, v, cls) { rows.push([k, v, cls || ""]); }

      function render() {
        el("checks").innerHTML = rows
          .map(([k, v, c]) => `<tr><td class="k">${k}</td><td class="${c}">${v}</td></tr>`)
          .join("");
      }

      //----------------------------------------------------------------------------------------------
      // setVerdict
      // The one line someone reads before anything else, so it states the
      // outcome rather than the evidence — the table underneath carries that.
      //----------------------------------------------------------------------------------------------
      function setVerdict(cls, text, sub) {
        const v = el("verdict");
        v.className = cls;
        v.innerHTML = text + (sub ? `<small>${sub}</small>` : "");
      }

      //----------------------------------------------------------------------------------------------
      // tick
      // Polls rather than waiting on events, because the Gamepad API exposes no
      // event for axis movement — state has to be sampled every frame.
      //
      // The blur counters accumulate here and are never reset, which is the
      // whole trick: the unfocused case cannot be observed while looking at it,
      // so it is recorded and read back afterwards.
      //----------------------------------------------------------------------------------------------
      function tick() {
        requestAnimationFrame(tick);
        const focused = document.hasFocus();
        const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
        const live = pads.filter((p) => p && p.connected);
        if (live.length) {
          everSaw = true;
          lastIds = live.map((p) => `${p.id} [${p.mapping || "no mapping"}, ${p.axes.length} axes]`);
          for (const p of live) for (const a of p.axes) maxAxis = Math.max(maxAxis, Math.abs(a));
          samples++;
        }
        if (!focused) {
          blurTicks++;
          if (live.length) {
            blurPadTicks++;
            blurEverPad = true;
            for (const p of live) for (const a of p.axes) blurMaxAxis = Math.max(blurMaxAxis, Math.abs(a));
          }
        }

        const pol = policyState();
        rows.length = 0;
        row("in an iframe", inIframe ? "YES" : "no — open this inside Onshape", inIframe ? "y" : "m");
        row("this origin", location.origin);
        row("secure context", window.isSecureContext ? "YES" : "NO — https required", window.isSecureContext ? "y" : "n");
        row("featurePolicy API", pol.supported ? "available" : "NOT available (non-Chromium?)", pol.supported ? "y" : "m");
        row("gamepad allowed here",
            pol.supported ? (pol.allowed ? "YES — embedder delegated it" : "NO — embedder did not set allow=\"gamepad\"") : "unknown",
            pol.supported ? (pol.allowed ? "y" : "n") : "m");
        row("navigator.getGamepads", navigator.getGamepads ? "present" : "absent", navigator.getGamepads ? "y" : "n");
        row("document.hasFocus()", document.hasFocus() ? "YES" : "no — click this frame", document.hasFocus() ? "y" : "m");
        row("pads visible now", live.length);
        row("pad ever seen", everSaw ? "YES" : "no — press a button on the pad", everSaw ? "y" : "m");
        row("device(s)", lastIds.length ? lastIds.join("<br>") : "&mdash;");
        row("samples with a pad", samples);
        row("largest |axis| seen",
            `<span class="bar" style="width:${Math.round(maxAxis * 90)}px"></span> ${maxAxis.toFixed(3)}`
            + (maxAxis > 0.25 ? " — axes ARE updating" : ""),
            maxAxis > 0.25 ? "y" : "");

        // --- blur test -------------------------------------------------------
        row("&mdash; BLUR TEST &mdash;",
            blurTicks === 0
              ? "not run yet: click the CAD viewport, waggle a stick, click back here"
              : `${blurTicks} ticks while unfocused`, "m");
        row("pad visible while unfocused",
            blurTicks === 0 ? "&mdash;" : (blurEverPad ? `YES (${blurPadTicks} ticks)` : "NO — went blind"),
            blurTicks === 0 ? "" : (blurEverPad ? "y" : "n"));
        row("largest |axis| while unfocused",
            blurTicks === 0 ? "&mdash;"
              : `${blurMaxAxis.toFixed(3)}` + (blurMaxAxis > 0.25
                  ? " — INPUT WORKS UNFOCUSED" : " — frozen, focus is required"),
            blurTicks === 0 ? "" : (blurMaxAxis > 0.25 ? "y" : "n"));
        render();

        // Verdict: policy first, because it is the question that can kill the approach.
        if (pol.supported && pol.allowed === false) {
          setVerdict("fail", "BLOCKED — gamepad is not delegated to this frame",
            "The embedder did not set allow=\"gamepad\". There is no workaround from inside the iframe; "
            + "the integrated-app route cannot read a controller as designed.");
        } else if (pol.supported && pol.allowed && maxAxis > 0.25) {
          setVerdict("pass", "WORKS — policy allows it and axes are live",
            "Both questions answered yes. Note the frame must hold focus; clicking the CAD viewport "
            + "will still freeze updates.");
        } else if (pol.supported && pol.allowed && everSaw) {
          setVerdict("wait", "ALLOWED — pad visible, now move a stick",
            "Policy permits gamepad here. Move a stick past 25% to confirm the frame receives live updates.");
        } else if (pol.supported && pol.allowed) {
          setVerdict("wait", "ALLOWED — now press a button on the controller",
            "Policy permits gamepad here. Chrome only reveals a pad after a button press on that device, "
            + "and this frame must be focused — click inside it first.");
        } else {
          setVerdict("wait", "Checking…", "If this persists, featurePolicy is unavailable — check the table below.");
        }

        setDump(JSON.stringify({
          when: new Date().toISOString(),
          inIframe, origin: location.origin, secureContext: window.isSecureContext,
          referrer: document.referrer || null,
          featurePolicySupported: pol.supported,
          gamepadAllowed: pol.allowed,
          gamepadIsKnownFeature: pol.known,
          hasFocus: document.hasFocus(),
          padsNow: live.length, everSawPad: everSaw, devices: lastIds,
          samplesWithPad: samples, maxAxisSeen: Number(maxAxis.toFixed(4)),
          blurTest: {
            ran: blurTicks > 0,
            ticksWhileUnfocused: blurTicks,
            ticksWithPadWhileUnfocused: blurPadTicks,
            maxAxisWhileUnfocused: Number(blurMaxAxis.toFixed(4)),
            verdict: blurTicks === 0 ? "not run"
              : blurMaxAxis > 0.25 ? "INPUT WORKS WHILE UNFOCUSED"
              : blurPadTicks > 0 ? "pad visible but axes frozen"
              : "went blind while unfocused",
          },
          userAgent: navigator.userAgent,
        }, null, 2));
      }

      let lastDump = "";

      //----------------------------------------------------------------------------------------------
      // setDump
      // The dump was being rewritten every animation frame, which destroyed any
      // selection ~60 times a second — that is why selecting it by hand was
      // hopeless. Rewrite only when the text actually changes, and never while
      // the user has a selection inside it.
      //----------------------------------------------------------------------------------------------
      function setDump(text) {
        if (text === lastDump) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount) {
          const node = sel.getRangeAt(0).commonAncestorContainer;
          const host = node.nodeType === 1 ? node : node.parentNode;
          if (host && el("dump").contains(host)) return;   // leave the selection alone
        }
        lastDump = text;
        el("dump").textContent = text;
      }

      //----------------------------------------------------------------------------------------------
      // copyText
      // Copying from inside a cross-origin iframe is awkward: the async Clipboard
      // API needs `clipboard-write` delegated via Permissions Policy, and Onshape
      // grants `gamepad` but not that. So try three routes, best first, and fall
      // back to selecting the text so Ctrl+C is a single keystroke rather than a
      // drag through a narrow panel.
      //----------------------------------------------------------------------------------------------
      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return "Copied";
          }
        } catch { /* delegation refused — fall through */ }

        // Legacy path: execCommand on a real, focused, selected textarea. Still
        // works inside a user gesture in frames where the async API is blocked.
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (ok) return "Copied";
        } catch { /* fall through */ }

        // Last resort: select the dump so the user only has to press Ctrl+C.
        try {
          const r = document.createRange();
          r.selectNodeContents(el("dump"));
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          return "Selected — press Ctrl+C";
        } catch { return "Copy failed"; }
      }

      el("copy").addEventListener("click", async () => {
        const btn = el("copy");
        btn.textContent = await copyText(el("dump").textContent);
        setTimeout(() => (btn.textContent = "Copy diagnostic"), 2200);
      });

      addEventListener("gamepadconnected", () => {});
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
